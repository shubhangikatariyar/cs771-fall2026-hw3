output_folder: "../logs"
model_type: "FM"
dataset:
  name: "MiniImageNet"
  data_folder: "../data/"
model:
  arch_type: "UNet"
  arch_cfg:
    context_dim: 96
    dim: 96
  use_vae: True
  vae_encoder_weights: "../pretrained/taesd_encoder.pth"
  vae_decoder_weights: "../pretrained/taesd_decoder.pth"
  timesteps: 10
loader:
  batch_size: 64
  num_workers: 4
train_cfg:
  lr: 0.0002
  epochs: 80
  warmup_epochs: 1
  num_eval_viz_samples: 5
test_cfg:
  num_eval_samples: 50
  cfg: True
  cfg_scale: 1.5
  cfg_start_t: 0.1
